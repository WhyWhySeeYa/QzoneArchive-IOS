name: Build iOS

# 只手动触发：push 时自动跑会与 workflow_dispatch 重复
on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew update
          brew install xcodegen || true
          xcodegen --version
          xcodegen generate
          PBX=QzoneArchive.xcodeproj/project.pbxproj
          # Homebrew 最新版会生成 format 77，Xcode 15.4 读不了，强制降回 51
          if grep -q 'objectVersion = 77;' "$PBX"; then
            sed -i '' 's/objectVersion = 77;/objectVersion = 51;/' "$PBX"
            sed -i '' 's/compatibilityVersion = "Xcode 15.0";/compatibilityVersion = "Xcode 14.0";/g' "$PBX"
          fi
          # 强制所有构建设置落到每个 target，避免 @StateObject 等被判定不可用
          /usr/libexec/PlistBuddy -c "Set :objects:$(/usr/libexec/PlistBuddy -c 'Print :objects' "$PBX" | grep -c XCBuildConfiguration) " /dev/null 2>/dev/null || true
          python3 - <<'PY'
          import re
          p = "QzoneArchive.xcodeproj/project.pbxproj"
          s = open(p).read()
          # 项目级默认部署目标
          s = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [^;]+;',
                     'IPHONEOS_DEPLOYMENT_TARGET = 16.0;', s)
          open(p, "w").write(s)
          n = s.count("IPHONEOS_DEPLOYMENT_TARGET = 16.0;")
          print(f"deployment target entries: {n}")
          if n == 0:
              raise SystemExit("no deployment target written")
          PY
          grep -c "IPHONEOS_DEPLOYMENT_TARGET = 16.0;" "$PBX"
          grep -m1 objectVersion "$PBX"

      - name: Build (unsigned, simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project QzoneArchive.xcodeproj \
            -scheme QzoneArchive \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build 2>&1 | tee build.log

      - name: Unit tests (unsigned, simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project QzoneArchive.xcodeproj \
            -scheme QzoneArchive \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            test-without-building 2>&1 | tee test.log || true

      # 真机包：模拟器包平台标记为 IOSSIMULATOR，装到设备上 dyld 会以
      # "wrong platform to load into process" 直接终止，必须单独出 iphoneos 包
      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -project QzoneArchive.xcodeproj \
            -scheme QzoneArchive \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            clean build 2>&1 | tee device-build.log

      - name: Package .app / .ipa
        if: success()
        run: |
          APP=$(find build/DerivedData -name "QzoneArchive.app" -type d | head -1)
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qr QzoneArchive-unsigned.ipa Payload
          rm -rf Payload
          zip -qr QzoneArchive-simulator.zip "$APP"

          DEVICE_APP=$(find build/DeviceData/Build/Products/Release-iphoneos -name "QzoneArchive.app" -type d | head -1)
          cp -r "$DEVICE_APP" Payload/
          zip -qry QzoneArchive-device-unsigned.ipa Payload
          rm -rf Payload
          # 平台标记自检：真机包必须是 iphoneos，模拟器包是 iphonesimulator
          echo "--- device ipa platform check ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleSupportedPlatforms:0" "$DEVICE_APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :DTPlatformName" "$DEVICE_APP/Info.plist"
          echo "--- simulator ipa platform check ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleSupportedPlatforms:0" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :DTPlatformName" "$APP/Info.plist"
          lipo -info "$DEVICE_APP/QzoneArchive" || true
          ls -la QzoneArchive-device-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: QzoneArchive-ios
          path: |
            QzoneArchive-device-unsigned.ipa
            QzoneArchive-unsigned.ipa
            QzoneArchive-simulator.zip
            build/DerivedData/Build/Products/Debug-iphonesimulator/**/*.dSYM
            build/DeviceData/Build/Products/Release-iphoneos/**/*.dSYM
