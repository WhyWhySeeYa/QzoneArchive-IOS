name: QzoneArchive
options:
  bundleIdPrefix: com.minis
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSorting: path
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  QzoneArchive:
    type: application
    platform: iOS
    sources:
      - path: QzoneArchive
    info:
      path: QzoneArchive/Resources/Info.plist
      properties:
        CFBundleDisplayName: QzoneArchive
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.minis.QzoneArchive.refresh]
    entitlements:
      path: QzoneArchive/Resources/QzoneArchive.entitlements
      properties:
        com.apple.security.application-groups: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minis.QzoneArchive
        CODE_SIGN_ENTITLEMENTS: QzoneArchive/Resources/QzoneArchive.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ENABLE_BITCODE: false
  QzoneArchiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: QzoneArchive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minis.QzoneArchiveTests
        GENERATE_INFOPLIST_FILE: true
schemes:
  QzoneArchive:
    build:
      targets:
        QzoneArchive: all
        QzoneArchiveTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QzoneArchiveTests
